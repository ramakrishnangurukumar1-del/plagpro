spring.application.name=backend

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:plagiarism_db}?sslmode=${DB_SSLMODE:prefer}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${PORT:8080}

app.jwt.secret=${JWT_SECRET:change-this-dev-secret-change-this-dev-secret}
app.jwt.expiration-ms=86400000

app.upload.dir=${UPLOAD_DIR:./uploads}
app.ml.base-url=${ML_BASE_URL:http://localhost:5000}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
logging.level.com.plagiarism.backend.service.PlagiarismService=DEBUG
