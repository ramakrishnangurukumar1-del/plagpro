spring.application.name=backend

spring.datasource.url=jdbc:mysql://localhost:3306/plagiarism_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080

app.jwt.secret=${JWT_SECRET:change-this-dev-secret-change-this-dev-secret}
app.jwt.expiration-ms=86400000

app.upload.dir=./uploads
app.ml.base-url=${ML_BASE_URL:http://localhost:5000}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

app.cors.allowed-origins=http://localhost:5173
logging.level.com.plagiarism.backend.service.PlagiarismService=DEBUG
